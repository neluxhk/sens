steps:
  # Paso 1: Instalar dependencias
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  # Paso 2: TypeScript check y build
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'NODE_ENV=production'

  # Paso 3: Desplegar en App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.yaml', '--version=prod-v1']

timeout: 1200s