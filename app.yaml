runtime: nodejs20
env: standard
instance_class: F1

env_variables:
  NODE_ENV: "production"

handlers:
  # 1️⃣ SERVIR MANIFEST EXPLÍCITAMENTE (CRÍTICO)
  - url: /manifest.json
    static_files: dist/manifest.json
    upload: dist/manifest.json
    secure: always

  # 2️⃣ SERVIR IMÁGENES Y ICONOS
  - url: /images
    static_dir: dist/images
    secure: always

  # 3️⃣ SERVIR ASSETS DE VITE
  - url: /assets
    static_dir: dist/assets
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  # 4️⃣ FALLBACK SPA (ÚLTIMO)
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    http_headers:
      Cache-Control: "no-cache, no-store, must-revalidate"

automatic_scaling:
  min_instances: 1
  max_instances: 3
  target_cpu_utilization: 0.65